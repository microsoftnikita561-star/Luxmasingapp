<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>История</title>
  <style>
    :root { --bg: #ffffff; --card: #f1f3f4; --text: #202124; --muted: #5f6368; --accent: #1a73e8; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #202124; --card: #35363a; --text: #e8eaed; --muted: #9aa0a6; --accent: #8ab4f8; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(860px, 100%); margin: 0 auto; padding: 28px 20px 60px; }
    h1 { font-size: 22px; font-weight: 500; margin: 0 0 16px; }
    input { width: 100%; height: 44px; border-radius: 22px; border: 2px solid transparent; background: var(--card); color: var(--text); padding: 0 20px; font: inherit; outline: 0; }
    input:focus { border-color: var(--accent); }
    h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 26px 0 6px; }
    a { display: flex; gap: 14px; align-items: baseline; padding: 7px 10px; border-radius: 6px; color: var(--text); text-decoration: none; }
    a:hover { background: var(--card); }
    .tm { color: var(--muted); font-size: 12px; width: 40px; flex: none; }
    .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
    .hs { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 10 80px; }
    .empty { color: var(--muted); margin-top: 30px; }
  </style>
</head>
<body>
  <main>
    <h1>История</h1>
    <input id="q" placeholder="Искать в истории" autofocus>
    <div id="list"></div>
  </main>
  <script>
    let rows = [];
    const list = document.getElementById('list');
    const q = document.getElementById('q');
    const day = (t) => new Date(t).toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    function draw() {
      const text = q.value.trim().toLowerCase();
      list.textContent = '';
      let shown = 0;
      let lastDay = '';
      for (const [url, title, time] of rows) {
        if (text && !url.toLowerCase().includes(text) && !(title || '').toLowerCase().includes(text)) continue;
        if (++shown > 500) break;
        const d = day(time);
        if (d !== lastDay) {
          lastDay = d;
          const h = document.createElement('h2');
          h.textContent = d;
          list.append(h);
        }
        const a = document.createElement('a');
        a.href = url;
        const tm = document.createElement('span');
        tm.className = 'tm';
        tm.textContent = new Date(time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const tt = document.createElement('span');
        tt.className = 'tt';
        tt.textContent = title || url;
        const hs = document.createElement('span');
        hs.className = 'hs';
        try { hs.textContent = new URL(url).hostname; } catch {}
        a.append(tm, tt, hs);
        list.append(a);
      }
      if (!shown) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = text ? 'Ничего не найдено' : 'История пуста';
        list.append(e);
      }
    }
    q.addEventListener('input', draw);
    window.renderLux = (data) => { rows = data; draw(); };
  </script>
</body>
</html>
